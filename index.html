<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Çeviri app 1</title>
    <meta name="description" content="A real-time translation messaging app for couples and friends speaking different languages." />
    <meta property="og:title" content="Çeviri app 1" />
    <meta property="og:description" content="A real-time translation messaging app for couples and friends speaking different languages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FFF7F5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveTranslate" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="alternate icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
    <!-- Prevent bounce and keep fixed layout on mobile -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <script>
      try {
        const stored = localStorage.getItem('livetranslate-storage');
        const parsed = stored ? JSON.parse(stored) : null;
        const colorTheme = parsed?.state?.colorTheme;
        document.documentElement.setAttribute('data-color-theme', !colorTheme ? 'indigo' : (colorTheme === 'indigo' && !parsed.version) ? 'blush' : colorTheme);
        if (parsed?.state?.theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
